services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sabu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabu
      POSTGRES_PASSWORD: sabu
      POSTGRES_DB: sabu
    ports:
      # Host 5433 avoids clashing with a local PostgreSQL already on 5432
      - "5433:5432"
    volumes:
      - sabu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabu -d sabu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sabu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sabu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sabu_pg_data:
  sabu_redis_data:
